[project]
name = "shipping-data-pipeline"
version = "0.1.0"
description = "Data pipeline for collecting and analyzing public shipping data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "polars>=1.0",
    "pyarrow>=17.0",
    "tenacity>=8.0",
    "websockets>=12.0",
]

[project.scripts]
sdp = "src.analytics.reports:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "mypy>=2.0",
]
hf = [
    "huggingface_hub>=0.35",
]
ml = [
    "holidays>=0.60",
    "lightgbm>=4.5",
    "numpy>=2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false

# numpy >= 2.5's stubs use 3.12-only syntax, which mypy rejects when checking
# for 3.11. Treat numpy (pulled in by the optional `ml` extra) as untyped.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
