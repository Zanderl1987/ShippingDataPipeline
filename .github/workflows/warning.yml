name: Disruption warning

# Weekly: train on everything published, score the newest week, and deploy
# the dashboard to GitHub Pages and a Hugging Face Space (the same page on
# both). PortWatch releases port data on Tuesdays; the daily Collect Data
# run at 06:00 UTC picks it up on Wednesday, so this runs after it.
on:
  schedule:
    - cron: '0 9 * * 3'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Append this week to the warnings history on HF'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# The history on HF has one writer: this job.
concurrency:
  group: disruption-warning
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.7"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Train, score the newest week and build the page
        run: |
          uv run python -m src.ml.disruption_warning.predict --hf --site site \
            ${{ (github.event_name == 'schedule' || inputs.publish) && '--publish --space' || '' }}

      - name: Upload the page for GitHub Pages
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy-pages:
    needs: forecast
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5.0.1
